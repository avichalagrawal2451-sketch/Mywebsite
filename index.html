<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Report Creator</title>
  <link rel="stylesheet" href="app.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>💼 Expense Report Creator</h1>
      <p>Manage and export your business expenses effortlessly</p>
    </header>

    <section class="layout">
      <aside class="panel file-panel">
        <h2>🗂️ File Management</h2>
        <label class="dropzone" for="fileUploader" id="dropzone">
          <input id="fileUploader" type="file" multiple hidden />
          <div class="dropzone-icon">📄</div>
          <p><strong>Drop your file here</strong><br/>or click to browse</p>
        </label>

        <ul id="attachmentList" class="attachment-list"></ul>

        <h2>📘 Export Report</h2>
        <div class="export-buttons">
          <button data-export="pdf">📄 PDF</button>
          <button data-export="excel">📊 Excel</button>
          <button data-export="csv">🧾 CSV</button>
          <button data-export="print">🖨️ Print</button>
        </div>
      </aside>

      <section class="panel form-panel">
        <h2>✏️ Add Expense</h2>
        <form id="expenseForm">
          <label>
            Expense Type *
            <select id="expenseType" required>
              <option value="">Select Type</option>
              <option>Travel</option>
              <option>Food</option>
              <option>Accommodation</option>
              <option>Office Supplies</option>
              <option>Entertainment</option>
              <option>Other</option>
            </select>
          </label>

          <label>
            Description *
            <input id="description" type="text" placeholder="e.g. Client dinner at Italian restaurant" required />
          </label>

          <div class="row two-cols">
            <label>
              Amount (₹) *
              <input id="amount" type="number" min="0" step="0.01" placeholder="0.00" required />
            </label>

            <label>
              Date *
              <input id="expenseDate" type="date" required />
            </label>
          </div>

          <div class="row two-cols">
            <label>
              Payment Mode
              <select id="paymentMode">
                <option>Cash</option>
                <option>Credit Card</option>
                <option>Debit Card</option>
                <option>UPI</option>
                <option>Bank Transfer</option>
              </select>
            </label>

            <label>
              Receipt Attached
              <select id="receiptAttached">
                <option value="No">No</option>
                <option value="Yes">Yes</option>
              </select>
            </label>
          </div>

          <button class="primary" type="submit">+ Add Expense</button>
          <button class="secondary" type="button" id="clearBtn">Clear Form</button>
        </form>

        <section class="table-wrap">
          <h3>Expense Entries</h3>
          <table id="expenseTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Date</th>
                <th>Type</th>
                <th>Description</th>
                <th>Payment</th>
                <th>Amount (₹)</th>
                <th>Receipt</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <p class="total">Total: ₹<span id="totalAmount">0.00</span></p>
        </section>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
